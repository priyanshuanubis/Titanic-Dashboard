<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h1>Titanic Passenger Dashboard</h1>

<div class="cards">

<div class="card">
<h2>Total Passengers</h2>
<p>891</p>
</div>

<div class="card">
<h2>Survival Rate</h2>
<p>38.38%</p>
</div>

<div class="card">
<h2>Average Age</h2>
<p>29.70</p>
</div>

</div>

<div class="chart-box">
<canvas id="classChart"></canvas>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
